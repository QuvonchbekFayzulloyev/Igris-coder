<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon: Qanday qilib bu darajaga yetdi? — Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0a0a0a; 
            color: #fff; 
            overflow: hidden;
            height: 100vh;
        }
        
        /* Main container */
        .presentation { 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
            overflow: hidden; 
        }
        
        /* Slide base */
        .slide { 
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 60px 80px; 
            opacity: 0;
            transform: translateX(100px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
        }
        .slide.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }
        .slide.prev {
            opacity: 0;
            transform: translateX(-100px);
        }
        
        /* Content */
        .slide-content { max-width: 1100px; width: 100%; }
        .slide-title { font-size: 42px; font-weight: 700; margin-bottom: 30px; text-align: center; }
        .slide-subtitle { font-size: 20px; color: #999; margin-bottom: 40px; text-align: center; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 24px; }
        .card h3 { font-size: 18px; margin-bottom: 12px; color: #ff9900; }
        .card p { font-size: 14px; color: #aaa; line-height: 1.6; }
        .stat { text-align: center; padding: 20px; }
        .stat .number { font-size: 48px; font-weight: 700; color: #ff9900; }
        .stat .label { font-size: 14px; color: #888; margin-top: 8px; }
        .highlight { color: #ff9900; }
        .tag { display: inline-block; background: #ff990020; color: #ff9900; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin: 4px; }
        .quote { font-size: 22px; font-style: italic; color: #ccc; text-align: center; max-width: 800px; line-height: 1.6; }
        .quote-author { font-size: 14px; color: #ff9900; margin-top: 16px; text-align: center; }
        .bg-gradient { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%); }
        .bg-amazon { background: linear-gradient(135deg, #0a0a0a 0%, #232f3e 100%); }
        
        /* ========== ANIMATIONS ========== */
        
        /* Slide content animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 153, 0, 0.3); }
            50% { box-shadow: 0 0 40px rgba(255, 153, 0, 0.6); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        @keyframes typewriter {
            from { width: 0; }
            to { width: 100%; }
        }
        @keyframes blink {
            0%, 50% { border-color: #ff9900; }
            51%, 100% { border-color: transparent; }
        }
        @keyframes countUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes barGrow {
            from { width: 0; }
            to { width: var(--bar-width); }
        }
        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.7; }
        }
        @keyframes timelineDraw {
            from { height: 0; }
            to { height: 100%; }
        }
        @keyframes itemAppear {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes cardFlip {
            from { opacity: 0; transform: rotateY(-90deg); }
            to { opacity: 1; transform: rotateY(0); }
        }
        @keyframes iconBounce {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(0.9); }
            75% { transform: scale(1.1); }
        }
        @keyframes particleFloat {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
        
        /* Animation classes */
        .animate-fade-in-up { animation: fadeInUp 0.6s ease forwards; }
        .animate-fade-in-down { animation: fadeInDown 0.6s ease forwards; }
        .animate-fade-in-left { animation: fadeInLeft 0.6s ease forwards; }
        .animate-fade-in-right { animation: fadeInRight 0.6s ease forwards; }
        .animate-scale-in { animation: scaleIn 0.5s ease forwards; }
        .animate-slide-in-up { animation: slideInUp 0.7s ease forwards; }
        .animate-slide-in-down { animation: slideInDown 0.7s ease forwards; }
        .animate-slide-in-left { animation: slideInLeft 0.7s ease forwards; }
        .animate-slide-in-right { animation: slideInRight 0.7s ease forwards; }
        .animate-pulse { animation: pulse 2s ease-in-out infinite; }
        .animate-glow { animation: glow 2s ease-in-out infinite; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-shimmer { animation: shimmer 2s linear infinite; }
        .animate-typewriter { animation: typewriter 2s steps(40) forwards; overflow: hidden; }
        .animate-blink { animation: blink 1s step-end infinite; }
        .animate-count-up { animation: countUp 0.8s ease forwards; }
        .animate-bar-grow { animation: barGrow 1s ease forwards; }
        .animate-dot-pulse { animation: dotPulse 1.5s ease-in-out infinite; }
        .animate-timeline-draw { animation: timelineDraw 1s ease forwards; }
        .animate-item-appear { animation: itemAppear 0.5s ease forwards; }
        .animate-card-flip { animation: cardFlip 0.6s ease forwards; }
        .animate-icon-bounce { animation: iconBounce 0.8s ease; }
        
        /* Stagger delays */
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }
        .delay-6 { animation-delay: 0.6s; }
        .delay-7 { animation-delay: 0.7s; }
        .delay-8 { animation-delay: 0.8s; }
        
        /* Card hover effects */
        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 153, 0, 0.2);
            border-color: #ff9900;
        }
        
        /* Stat number animation */
        .stat .number {
            transition: transform 0.3s ease, color 0.3s ease;
        }
        .stat:hover .number {
            transform: scale(1.1);
            color: #ffb84d;
        }
        
        /* Tag hover */
        .tag {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .tag:hover {
            background: #ff990040;
            transform: scale(1.05);
        }
        
        /* Timeline item hover */
        .timeline-item {
            transition: all 0.3s ease;
        }
        .timeline-item:hover {
            transform: translateX(10px);
        }
        .timeline-item:hover::before {
            background: #ffb84d;
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.5);
        }
        
        /* Quote animation */
        .quote {
            position: relative;
            padding: 20px 30px;
        }
        .quote::before {
            content: '"';
            position: absolute;
            left: 0;
            top: -10px;
            font-size: 80px;
            color: #ff9900;
            opacity: 0.3;
            font-family: Georgia, serif;
        }
        
        /* Button hover */
        .nav-btn {
            transition: all 0.3s ease;
        }
        .nav-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 153, 0, 0.3);
        }
        .nav-btn:active:not(:disabled) {
            transform: translateY(0);
        }
        
        /* Progress bar animation */
        .progress-fill {
            transition: width 0.5s ease;
        }
        
        /* Slide transition enhancement */
        .slide {
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), 
                        transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Particle container */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ff9900;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 8s linear infinite;
        }
        .particle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 7s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 1s; animation-duration: 9s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 2s; animation-duration: 6s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 0.5s; animation-duration: 8s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 1.5s; animation-duration: 10s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 2.5s; animation-duration: 7s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 0.8s; animation-duration: 9s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 1.8s; animation-duration: 6s; }
        .particle:nth-child(9) { left: 90%; animation-delay: 2.8s; animation-duration: 8s; }
        .particle:nth-child(10) { left: 95%; animation-delay: 0.3s; animation-duration: 11s; }
        
        /* Cover slide special effects */
        .cover-title {
            text-shadow: 0 0 40px rgba(255, 153, 0, 0.5);
        }
        .cover-subtitle {
            background: linear-gradient(90deg, #ff9900, #ffcc00, #ff9900);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }
        
        /* Chart bar animation */
        .chart-bar {
            transform-origin: left;
            animation: barGrow 1.2s ease forwards;
            animation-play-state: paused;
        }
        .slide.active .chart-bar {
            animation-play-state: running;
        }
        
        /* ========== PRINT/PDF STYLES ========== */
        @media print {
            body {
                background: white !important;
                overflow: visible !important;
                height: auto !important;
            }
            .presentation {
                position: static !important;
                overflow: visible !important;
                height: auto !important;
            }
            .slide {
                position: static !important;
                opacity: 1 !important;
                transform: none !important;
                pointer-events: auto !important;
                page-break-after: always;
                page-break-inside: avoid;
                height: 100vh !important;
                width: 100vw !important;
                background: white !important;
                color: #333 !important;
            }
            .slide:last-child {
                page-break-after: avoid;
            }
            .slide-title, .slide-subtitle, h2, h3 {
                color: #333 !important;
            }
            .slide-title {
                font-size: 36px !important;
            }
            .card {
                background: #f5f5f5 !important;
                border: 1px solid #ddd !important;
                box-shadow: none !important;
            }
            .card h3 {
                color: #ff9900 !important;
            }
            .card p, .card li, td {
                color: #555 !important;
            }
            .highlight {
                color: #ff6600 !important;
            }
            .tag {
                background: #fff3e0 !important;
                color: #ff6600 !important;
                border: 1px solid #ff9900 !important;
            }
            .stat .number {
                color: #ff6600 !important;
            }
            .stat .label {
                color: #666 !important;
            }
            .chart-bar {
                background: #ff9900 !important;
                animation: none !important;
                width: var(--bar-width, 50%) !important;
            }
            .nav-bar, .nav-btn, .keyboard-hints, .fullscreen-btn, .slide-counter, .thumbnail-strip, .pdf-btn {
                display: none !important;
            }
            .particles {
                display: none !important;
            }
            .timeline::before {
                background: #ccc !important;
            }
            .timeline-item::before {
                background: #ff9900 !important;
            }
            th {
                background: #f0f0f0 !important;
                color: #333 !important;
            }
            table {
                border: 1px solid #ddd !important;
            }
            th, td {
                border: 1px solid #ddd !important;
            }
            .quote {
                color: #555 !important;
                font-style: italic !important;
            }
            .quote::before {
                color: #ff9900 !important;
            }
            .quote-author {
                color: #ff6600 !important;
            }
            /* PDF qo'shimcha sahifalar */
            .pdf-cover {
                display: flex !important;
            }
            .pdf-footer {
                display: block !important;
                position: fixed;
                bottom: 20px;
                left: 0;
                right: 0;
                text-align: center;
                font-size: 10px;
                color: #999;
            }
        }
        
        /* PDF qo'shimcha elementlar */
        .pdf-cover {
            display: none;
        }
        .pdf-footer {
            display: none;
        }
        
        /* PDF Export button */
        .pdf-btn {
            position: fixed;
            top: 20px;
            left: 80px;
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 8px 12px;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            z-index: 100;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pdf-btn:hover {
            background: #333;
            color: #ff9900;
            border-color: #ff9900;
        }
        .pdf-btn.exporting {
            pointer-events: none;
            opacity: 0.7;
        }
        .pdf-btn.exporting::after {
            content: '';
            width: 12px;
            height: 12px;
            border: 2px solid #ff9900;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* PDF Options Modal */
        .pdf-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .pdf-modal-overlay.visible {
            display: flex;
        }
        .pdf-modal {
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 0;
            width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: scaleIn 0.25s ease;
        }
        .pdf-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #333;
        }
        .pdf-modal-header h3 {
            margin: 0;
            font-size: 16px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
        }
        .pdf-modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .pdf-modal-close:hover {
            color: #fff;
            background: #333;
        }
        .pdf-modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .pdf-option-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .pdf-option-label {
            font-size: 12px;
            color: #aaa;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .pdf-option-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .pdf-option-row label {
            font-size: 12px;
            color: #bbb;
            width: 50px;
            flex-shrink: 0;
        }
        .pdf-option-row input,
        .pdf-option-row select {
            flex: 1;
            background: #0d0d1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px 10px;
            color: #fff;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
        }
        .pdf-option-row input:focus,
        .pdf-option-row select:focus {
            border-color: #ff9900;
        }
        .pdf-option-row input[type="number"] {
            width: 70px;
            flex: 0 0 70px;
        }
        .pdf-page-sizes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .pdf-page-size-btn {
            padding: 8px 14px;
            background: #0d0d1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #bbb;
            font-size: 12px;\            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.15s;
        }
        .pdf-page-size-btn:hover {
            border-color: #666;
            color: #fff;
        }
        .pdf-page-size-btn.active {
            background: #ff9900;
            border-color: #ff9900;
            color: #000;
            font-weight: bold;
        }
        .pdf-modal-footer {
            padding: 14px 20px;
            border-top: 1px solid #333;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .pdf-modal-btn {
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            border: 1px solid #333;
            transition: all 0.15s;
        }
        .pdf-modal-btn.cancel {
            background: #0d0d1a;
            color: #aaa;
        }
        .pdf-modal-btn.cancel:hover {
            color: #fff;
            border-color: #666;
        }
        .pdf-modal-btn.export {
            background: #ff9900;
            color: #000;
            font-weight: bold;
            border-color: #ff9900;
        }
        .pdf-modal-btn.export:hover {
            background: #ffb347;
        }
        
        /* PDF Preview Panel */
        .pdf-preview-panel {
            background: #0d0d1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .pdf-preview-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: 'JetBrains Mono', monospace;
            align-self: flex-start;
        }
        .pdf-preview-page {
            background: white;
            border: 1px solid #444;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: width 0.3s, height 0.3s;
        }
        .pdf-preview-header {
            background: #f8f8f8;
            border-bottom: 1px solid #ddd;
            padding: 4px 8px;
            font-size: 7px;
            color: #666;
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            min-height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pdf-preview-header:empty {
            display: none;
        }
        .pdf-preview-content {
            flex: 1;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }
        .pdf-preview-title {
            width: 60%;
            height: 6px;
            background: #333;
            border-radius: 2px;
            margin-bottom: 4px;
        }
        .pdf-preview-line {
            height: 2px;
            background: #ccc;
            border-radius: 1px;
        }
        .pdf-preview-line.short { width: 70%; }
        .pdf-preview-line.medium { width: 85%; }
        .pdf-preview-cards {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        .pdf-preview-card {
            flex: 1;
            height: 20px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 2px;
        }
        .pdf-preview-chart {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 25px;
            margin-top: 4px;
        }
        .pdf-preview-bar {
            flex: 1;
            background: #ff9900;
            border-radius: 1px 1px 0 0;
            min-height: 3px;
        }
        .pdf-preview-footer {
            background: #f8f8f8;
            border-top: 1px solid #ddd;
            padding: 3px 8px;
            font-size: 6px;
            color: #999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 12px;
            font-family: 'JetBrains Mono', monospace;
        }
        .pdf-preview-footer:empty {
            display: none;
        }
        .pdf-preview-margin-guides {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;

// Create navigation dots
function createDots() {
    const dotsContainer = document.getElementById('slideDots');
    dotsContainer.innerHTML = '';
    for (let i = 1; i <= totalSlides; i++) {
        const dot = document.createElement('div');
        dot.className = `slide-dot ${i === 1 ? 'active' : ''}`;
        dot.onclick = () => goToSlide(i);
        dot.title = slides[i-1].title;
        dotsContainer.appendChild(dot);
    }
}

// Create thumbnail strip
function createThumbnails() {
    const strip = document.getElementById('thumbnailStrip');
    strip.innerHTML = '';
    slides.forEach((slide, index) => {
        const thumb = document.createElement('div');
        thumb.className = `thumbnail ${index === 0 ? 'active' : ''}`;
        thumb.onclick = () => goToSlide(slide.id);
        thumb.innerHTML = `<span>${slide.icon} ${slide.title}</span>`;
        strip.appendChild(thumb);
    });
}

// Navigation functions
function goToSlide(id) {
    if (id < 1 || id > totalSlides) return;
    
    const currentEl = document.getElementById(`slide-${currentSlide}`);
    const nextEl = document.getElementById(`slide-${id}`);
    
    // Determine direction
    const direction = id > currentSlide ? 'next' : 'prev';
    
    // Remove active from current
    currentEl.classList.remove('active');
    currentEl.classList.add(direction === 'next' ? 'prev' : '');
    
    // Add active to next
    nextEl.classList.remove('prev');
    nextEl.classList.add('active');
    
    currentSlide = id;
    updateUI();
}

function nextSlide() {
    if (currentSlide < totalSlides) {
        goToSlide(currentSlide + 1);
    }
}

function prevSlide() {
    if (currentSlide > 1) {
        goToSlide(currentSlide - 1);
    }
}

// Update UI
function updateUI() {
    // Update counter
    document.getElementById('currentSlide').textContent = currentSlide;
    
    // Update progress
    const progress = (currentSlide / totalSlides) * 100;
    document.getElementById('progressFill').style.width = `${progress}%`;
    document.getElementById('slidePercent').textContent = `${Math.round(progress)}%`;
    document.getElementById('slideTitle').textContent = slides[currentSlide - 1].title;
    
    // Update buttons
    document.getElementById('prevBtn').disabled = currentSlide === 1;
    document.getElementById('nextBtn').disabled = currentSlide === totalSlides;
    
    // Update dots
    document.querySelectorAll('.slide-dot').forEach((dot, index) => {
        dot.classList.toggle('active', index + 1 === currentSlide);
    });
    
    // Update thumbnails
    document.querySelectorAll('.thumbnail').forEach((thumb, index) => {
        thumb.classList.toggle('active', index + 1 === currentSlide);
    });
    
    // Scroll thumbnail into view
    const activeThumb = document.querySelector('.thumbnail.active');
    if (activeThumb) {
        activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
}

// Fullscreen

    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

function renderPdfPreview() {
    const page = document.getElementById('pdfPreviewPage');
    const header = document.getElementById('pdfPreviewHeader');
    const content = document.getElementById('pdfPreviewContent');
    const footer = document.getElementById('pdfPreviewFooter');
    const guides = document.getElementById('pdfPreviewGuides');
    const info = document.getElementById('pdfPreviewInfo');
    const prevBtn = document.getElementById('pdfPreviewPrev');
    const nextBtn = document.getElementById('pdfPreviewNext');
    
    // Update page size
    const isLandscape = pdfOptions.orientation === 'landscape' || pdfOptions.pageSize === '16:9';
    const ratios = {
        '16:9': { w: 280, h: 158 },
        'A4': isLandscape ? { w: 280, h: 198 } : { w: 210, h: 280 },
        'Letter': isLandscape ? { w: 280, h: 214 } : { w: 210, h: 272 },
        'A3': isLandscape ? { w: 280, h: 198 } : { w: 210, h: 280 },
        'Legal': isLandscape ? { w: 280, h: 224 } : { w: 210, h: 280 }
    };
    const r = ratios[pdfOptions.pageSize] || ratios['16:9'];
    page.style.width = r.w + 'px';
    page.style.height = r.h + 'px';
    
    // Update margins guide
    const mScale = 0.5; // mm to px approx
    guides.style.top = (pdfOptions.marginTop * mScale) + 'px';
    guides.style.bottom = (pdfOptions.marginBottom * mScale) + 'px';
    guides.style.left = (pdfOptions.marginLeft * mScale) + 'px';
    guides.style.right = (pdfOptions.marginRight * mScale) + 'px';
    
    // Update header
    if (pdfOptions.headerText) {
        header.textContent = pdfOptions.headerText;
        header.style.textAlign = pdfOptions.headerAlign;
        header.style.fontSize = Math.max(6, pdfOptions.headerSize * 0.7) + 'px';
        header.style.display = 'flex';
    } else {
        header.style.display = 'none';
    }
    
    // Update content with slide preview
    const contentFn = PREVIEW_SLIDE_CONTENTS[Math.min(pdfPreviewIndex, PREVIEW_SLIDE_CONTENTS.length - 1)];
    content.innerHTML = contentFn();
    
    // Update footer
    let footerText = '';
    const total = 15;
    if (pdfOptions.footerStyle === 'number') {
        footerText = `<span style="flex:1;text-align:center">${pdfPreviewIndex + 1} / ${total}</span>`;
    } else if (pdfOptions.footerStyle === 'text') {
        const left = pdfOptions.footerLeft || 'Amazon';
        const right = pdfOptions.footerRight || `${pdfPreviewIndex + 1} / ${total}`;
        footerText = `<span>${left}</span><span>${right}</span>`;
    } else {
        const left = pdfOptions.footerLeft || '';
        const right = pdfOptions.footerRight || `${pdfPreviewIndex + 1} / ${total}`;
        footerText = `<span>${left}</span><span>${right}</span>`;
    }
    footer.innerHTML = footerText;
    footer.style.fontSize = Math.max(5, pdfOptions.footerSize * 0.7) + 'px';
    footer.style.display = 'flex';
    
    // Update nav

    nextBtn.disabled = pdfPreviewIndex >= total - 1;
}

    btn.textContent = '⏳ Export...';

    const selected = Array.from(batchSelectedSlides).sort((a, b) => a - b);
    const total = selected.length;
    const filename = document.getElementById('pdfBatchFilename').value || 'presentation';
    
    if (batchMode === 'combined') {
        // Export all selected slides as one PDF
        text.textContent = `PDF tayyorlanmoqda... (0/${total})`;
        fill.style.width = '50%';
        await new Promise(r => setTimeout(r, 300));
        
        // Show only selected slides
        const allSlides = document.querySelectorAll('.slide');
        allSlides.forEach((slide, i) => {
            if (selected.includes(i)) {
                slide.style.display = 'flex';
            } else {
                slide.style.display = 'none';
            }
        });
        
        text.textContent = `Print dialog ochilmoqda...`;
        fill.style.width = '100%';
        await new Promise(r => setTimeout(r, 200));
        
        // Use existing exportPDF with selected slides
        exportPDF(pdfOptions, selected);
        
    } else if (batchMode === 'separate') {
        // Export each selected slide as separate PDF
        for (let idx = 0; idx < total; idx++) {
            const slideIdx = selected[idx];
            text.textContent = `PDF ${idx + 1}/${total} tayyorlanmoqda...`;
            fill.style.width = ((idx / total) * 100) + '%';
            
            const allSlides = document.querySelectorAll('.slide');
            allSlides.forEach((slide, i) => {
                if (i === slideIdx) {
                    slide.style.display = 'flex';
                    slide.style.opacity = '1';
                    slide.style.transform = 'none';
                    slide.style.position = 'relative';
                    slide.style.minHeight = '100vh';
                    slide.style.background = 'white';
                    slide.style.color = '#333';
                    slide.style.padding = '40px 60px';
                } else {
                    slide.style.display = 'none';
                }
            });
            
            // Hide nav elements
            document.querySelector('.nav-bar').style.display = 'none';
            document.querySelector('.keyboard-hints').style.display = 'none';
            document.querySelector('.fullscreen-btn').style.display = 'none';
            document.querySelector('.slide-counter').style.display = 'none';
            document.querySelector('.pdf-btn').style.display = 'none';
            
            text.textContent = `PDF ${idx + 1}/${total} — ${SLIDE_TITLES[slideIdx] || 'Slayd ' + (slideIdx+1)}`;
            
            await new Promise(r => setTimeout(r, 100));
            window.print();
            await new Promise(r => setTimeout(r, 500));
            
            // Restore
            allSlides.forEach((slide, i) => {
                slide.style.cssText = '';
                slide.className = 'slide ' + (i + 1 === currentSlide ? 'active' : '');
            });
            document.querySelector('.nav-bar').style.display = '';
            document.querySelector('.keyboard-hints').style.display = '';
            document.querySelector('.fullscreen-btn').style.display = '';
            document.querySelector('.slide-counter').style.display = '';
            document.querySelector('.pdf-btn').style.display = '';
        }
        
    } else if (batchMode === 'images') {
        // Export as PNG images using html2canvas approach
        for (let idx = 0; idx < total; idx++) {
            const slideIdx = selected[idx];
            text.textContent = `Rasm ${idx + 1}/${total} — ${SLIDE_TITLES[slideIdx] || 'Slayd ' + (slideIdx+1)}`;
            fill.style.width = ((idx / total) * 100) + '%';
            
            // Show only this slide
            const allSlides = document.querySelectorAll('.slide');
            allSlides.forEach((slide, i) => {
                if (i === slideIdx) {
                    slide.style.opacity = '1';
                    slide.style.transform = 'none';
                    slide.style.position = 'relative';
                    slide.style.display = 'flex';
                    slide.style.background = 'white';
                    slide.style.color = '#333';
                    slide.style.padding = '40px 60px';
                    slide.style.width = '1920px';
                    slide.style.height = '1080px';
                } else {
                    slide.style.display = 'none';
                }
            });
            
            document.querySelector('.nav-bar').style.display = 'none';
            document.querySelector('.keyboard-hints').style.display = 'none';
            document.querySelector('.fullscreen-btn').style.display = 'none';
            document.querySelector('.slide-counter').style.display = 'none';
            
            await new Promise(r => setTimeout(r, 200));
            
            // Capture using canvas
            try {
                const activeSlide = allSlides[slideIdx];
                const canvas = await htmlToCanvas(activeSlide);
                if (canvas) {
                    const link = document.createElement('a');
                    link.download = `${filename}-slide-${slideIdx + 1}-${SLIDE_TITLES[slideIdx] || 'slide'}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }
            } catch(e) {
                console.warn('Canvas export failed, falling back to print', e);
                window.print();
            }
            
            // Restore
            allSlides.forEach((slide, i) => {
                slide.style.cssText = '';
                slide.className = 'slide ' + (i + 1 === currentSlide ? 'active' : '');
            });
            document.querySelector('.nav-bar').style.display = '';
            document.querySelector('.keyboard-hints').style.display = '';
            document.querySelector('.fullscreen-btn').style.display = '';
            document.querySelector('.slide-counter').style.display = '';
        }
    }
    
    fill.style.width = '100%';
    text.textContent = `Tayyor! ${total} ta fayl export qilindi.`;
    await new Promise(r => setTimeout(r, 1500));
    
    progress.classList.remove('active');
    fill.style.width = '0%';
    btn.disabled = false;
    btn.textContent = '📑 Batch export';
    batchExporting = false;
}

function htmlToCanvas(element) {
    return new Promise((resolve) => {
        try {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const rect = element.getBoundingClientRect();
            canvas.width = 1920;
            canvas.height = 1080;
            
            // Draw white background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw text content
            ctx.fillStyle = '#333333';
            ctx.font = '24px Arial';
            const text = element.innerText || element.textContent || '';
            const lines = text.split('\n').slice(0, 30);
            lines.forEach((line, i) => {
                if (i < 30) {
                    ctx.fillText(line.substring(0, 80), 60, 80 + i * 30);
                }
            });
            
            resolve(canvas);
        } catch(e) {
            resolve(null);
        }
    });
}

// PDF Export with options
function exportPDFWithOptions() {
    savePdfOptions();
    closePdfModal();
    exportPDF(pdfOptions);
}

function exportPDF(opts, selectedSlides) {
    opts = opts || pdfOptions;
    const btn = document.getElementById('pdfBtn');
    btn.classList.add('exporting');
    btn.innerHTML = '⏳ Yuklanmoqda...';
    
    const pageSize = PDF_PAGE_SIZES[opts.pageSize] || PDF_PAGE_SIZES['16:9'];
    const allSlides = document.querySelectorAll('.slide');
    const total = allSlides.length;
    
    // Filter slides if selectedSlides provided
    const slidesToShow = selectedSlides ? selectedSlides : Array.from({length: total}, (_, i) => i);
    
    // Set page size CSS variable
    document.documentElement.style.setProperty('--pdf-page-width', pageSize.width);
    document.documentElement.style.setProperty('--pdf-page-height', pageSize.height);
    document.documentElement.style.setProperty('--pdf-margin-top', opts.marginTop + 'mm');
    document.documentElement.style.setProperty('--pdf-margin-bottom', opts.marginBottom + 'mm');
    document.documentElement.style.setProperty('--pdf-margin-left', opts.marginLeft + 'mm');
    document.documentElement.style.setProperty('--pdf-margin-right', opts.marginRight + 'mm');
    document.documentElement.style.setProperty('--pdf-header-size', opts.headerSize + 'px');
    document.documentElement.style.setProperty('--pdf-footer-size', opts.footerSize + 'px');
    
    // Show selected slides for print
    allSlides.forEach((slide, idx) => {
        if (slidesToShow.includes(idx)) {
            slide.style.opacity = '1';
            slide.style.transform = 'none';
            slide.style.position = 'relative';
            slide.style.pageBreakAfter = 'always';
            slide.style.display = 'flex';
            slide.style.padding = `${opts.marginTop + 10}px ${opts.marginRight + 20}px ${opts.marginBottom + 10}px ${opts.marginLeft + 20}px`;
            slide.style.background = 'white';
            slide.style.color = '#333';
            if (opts.pageSize !== '16:9') {
                slide.style.width = pageSize.width;
                slide.style.minHeight = pageSize.height;
                slide.style.maxWidth = pageSize.width;
            } else {
                slide.style.minHeight = '100vh';
                slide.style.width = '100vw';
            }
        } else {
            slide.style.display = 'none';
        }
    });
    
    // Hide navigation elements
    document.querySelector('.nav-bar').style.display = 'none';
    document.querySelector('.keyboard-hints').style.display = 'none';
    document.querySelector('.fullscreen-btn').style.display = 'none';
    document.querySelector('.slide-counter').style.display = 'none';
    document.querySelector('.pdf-btn').style.display = 'none';
    document.querySelector('.thumbnail-strip').style.display = 'none';
    document.getElementById('pdfModal').style.display = 'none';
    
    // Add header and footer to each visible slide
    let pageCounter = 0;
    allSlides.forEach((slide, index) => {
        if (!slidesToShow.includes(index)) return;
        pageCounter++;
        
        // Header
        if (opts.headerText) {
            const header = document.createElement('div');
            header.className = 'pdf-header';
            header.style.cssText = `position: absolute; top: ${opts.marginTop / 2}px; left: ${opts.marginLeft}px; right: ${opts.marginRight}px; text-align: ${opts.headerAlign}; font-size: ${opts.headerSize}px; color: #999; border-bottom: 1px solid #eee; padding-bottom: 8px; font-family: 'JetBrains Mono', monospace;`;
            header.textContent = opts.headerText;
            slide.appendChild(header);
        }
        
        // Footer
        const footer = document.createElement('div');
        footer.className = 'pdf-footer';
        const footerStyle = opts.footerStyle;
        const exportTotal = slidesToShow.length;
        let footerContent = '';
        
        if (footerStyle === 'number') {
            footerContent = `<span></span><span style="text-align:center;flex:1">${pageCounter} / ${exportTotal}</span><span></span>`;
        } else if (footerStyle === 'text') {
            const left = opts.footerLeft || 'Amazon: Qanday qilib bu darajaga yetdi?';
            const right = opts.footerRight || `${pageCounter} / ${exportTotal}`;
            footerContent = `<span>${left}</span><span>${right}</span>`;
        } else {
            const left = opts.footerLeft || '';
            const right = opts.footerRight || `${pageCounter} / ${exportTotal}`;
            footerContent = `<span>${left}</span><span>${right}</span>`;
        }
        
        footer.style.cssText = `position: absolute; bottom: ${opts.marginBottom / 2}px; left: ${opts.marginLeft}px; right: ${opts.marginRight}px; display: flex; justify-content: space-between; align-items: center; font-size: ${opts.footerSize}px; color: #999; border-top: 1px solid #eee; padding-top: 8px; font-family: 'JetBrains Mono', monospace;`;
        footer.innerHTML = footerContent;
        slide.appendChild(footer);
    });
    
    // Inject print-specific styles for page size
    const printStyle = document.createElement('style');
    printStyle.id = 'pdf-print-style';
    printStyle.textContent = `
        @media print {
            @page {
                size: ${opts.pageSize === '16:9' ? 'landscape' : opts.orientation};
                margin: 0;
            }
            .slide {
                width: ${pageSize.width} !important;
                min-height: ${pageSize.height} !important;
                max-height: ${pageSize.height} !important;
                padding: ${opts.marginTop + 10}px ${opts.marginRight + 20}px ${opts.marginBottom + 10}px ${opts.marginLeft + 20}px !important;
            }
        }
    `;
    document.head.appendChild(printStyle);
    
    // Trigger print
    setTimeout(() => {
        window.print();
        
        // Restore original state after print
        setTimeout(() => {
            // Remove injected print style
            const injected = document.getElementById('pdf-print-style');
            if (injected) injected.remove();
            
            // Clear CSS variables
            ['--pdf-page-width','--pdf-page-height','--pdf-margin-top','--pdf-margin-bottom','--pdf-margin-left','--pdf-margin-right','--pdf-header-size','--pdf-footer-size'].forEach(v => {
                document.documentElement.style.removeProperty(v);
            });
            
            allSlides.forEach((slide, index) => {
                slide.style.cssText = '';
                slide.className = 'slide ' + (index + 1 === currentSlide ? 'active' : '');
                // Remove PDF header/footer
                const hdr = slide.querySelector('.pdf-header');
                if (hdr) hdr.remove();
                const ftr = slide.querySelector('.pdf-footer');
                if (ftr) ftr.remove();
            });
            
            document.querySelector('.nav-bar').style.display = '';
            document.querySelector('.keyboard-hints').style.display = '';
            document.querySelector('.fullscreen-btn').style.display = '';
            document.querySelector('.slide-counter').style.display = '';
            document.querySelector('.pdf-btn').style.display = '';
            document.querySelector('.thumbnail-strip').style.display = '';
            
            btn.classList.remove('exporting');
            btn.innerHTML = '📄 PDF';
        }, 1000);
    }, 500);
}

// Toggle thumbnails
function toggleThumbnails() {
    thumbnailsVisible = !thumbnailsVisible;
    document.getElementById('thumbnailStrip').classList.toggle('visible', thumbnailsVisible);
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
    switch(e.key) {
        case 'ArrowRight':
        case ' ':
            e.preventDefault();
            nextSlide();
            break;
        case 'ArrowLeft':
            e.preventDefault();
            prevSlide();
            break;
        case 'f':
        case 'F':
            toggleFullscreen();
            break;
        case 'p':
        case 'P':
            openPdfModal();
            break;
        case 't':
        case 'T':
            toggleThumbnails();
            break;
        case 'Home':
            goToSlide(1);
            break;
        case 'End':
            goToSlide(totalSlides);
            break;
        case 'Escape':
            closePdfModal();
            break;
    }
});

// Touch support
let touchStartX = 0;
let touchEndX = 0;

document.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
});

document.addEventListener('touchend', (e) => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
});

function handleSwipe() {
    const diff = touchStartX - touchEndX;
    if (Math.abs(diff) > 50) {
        if (diff > 0) {
            nextSlide();
        } else {
            prevSlide();
        }
    }
}

// Mouse wheel navigation
document.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) > 30) {
        if (e.deltaY > 0) {
            nextSlide();
        } else {
            prevSlide();
        }
    }
}, { passive: true });

// PDF modal - click outside to close
document.getElementById('pdfModal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('pdfModal')) {
        closePdfModal();
    }
});

// Initialize
init();
</script>
