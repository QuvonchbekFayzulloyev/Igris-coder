[package]
name = "igris-desktop"
version = "0.1.0"
description = "igris desktop UI - Tauri shell around the igris Python backend"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "igris-desktop"
path = "src/main.rs"
