[pytest]
# Ildizdan bir buyruq bilan TO'LIQ suita: Igris_brain + 2nd_brain/backend
# (2nd Brain testlari 2nd_brain/ ga ko'chirilgandan keyin ham qolib ketmaydi).
testpaths = Igris_brain 2nd_brain/backend

# Faqat haqiqiy test fayllar (test_*.py) yig'iladi — debug/oddiy skriptlar
# import'da MCP/LLM'ni ishga tushirib, kolleksiyani bloklab qo'ymasligi uchun.
python_files = test_*.py

# Ijro paytida vaqtinchalik/report papkalarini skanerlama
norecursedirs = reports agent_workspace e2e_shots .pytest_cache __pycache__ node_modules dist-web
