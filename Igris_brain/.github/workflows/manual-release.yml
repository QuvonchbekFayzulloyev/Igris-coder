name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.3.0)'
        required: true
        type: string
      bump_type:
        description: 'Bump type (if version not specified)'
        required: false
        type: choice
        options:
          - none
          - patch
          - minor
          - major
          - pre-alpha
          - pre-beta
          - pre-rc
        default: none
      dry_run:
        description: 'Dry run (preview only)'
        required: false
        type: boolean
        default: false
      skip_tests:
        description: 'Skip tests'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.bump_type }}" != "none" ]; then
            python -c "
          from version_bumper import get_current_version
          v = get_current_version()
          bump = '${{ inputs.bump_type }}'
          if bump == 'patch':
              new_v = v.bump_patch()
          elif bump == 'minor':
              new_v = v.bump_minor()
          elif bump == 'major':
              new_v = v.bump_major()
          elif bump == 'pre-alpha':
              new_v = v.bump_pre_release('alpha')
          elif bump == 'pre-beta':
              new_v = v.bump_pre_release('beta')
          elif bump == 'pre-rc':
              new_v = v.bump_pre_release('rc')
          else:
              new_v = v
          print(new_v)
          " | tee /tmp/version.txt
            echo "version=$(cat /tmp/version.txt)" >> $GITHUB_OUTPUT
          else
            echo "version=unknown" >> $GITHUB_OUTPUT
          fi
      
      - name: Validate version
        if: steps.version.outputs.version != 'unknown'
        run: |
          python version_bumper.py validate ${{ steps.version.outputs.version }}
      
      - name: Check clean working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::Working tree has uncommitted changes"
          fi

  test:
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      
      - name: Run tests
        run: |
          pytest test_*.py -v

  release:
    needs: [validate, test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run release script
        if: ${{ !inputs.dry_run }}
        run: |
          python release.py \
            --version ${{ needs.validate.outputs.version }} \
            --skip-tests \
            --skip-push \
            --skip-github
      
      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: |
          echo "=== DRY RUN MODE ==="
          echo "Version: ${{ needs.validate.outputs.version }}"
          echo ""
          echo "Would bump version"
          echo "Would generate changelog"
          echo "Would create commit"
          echo "Would create tag"
          echo "Would push to remote"
          echo "Would create GitHub release"
      
      - name: Generate changelog
        run: |
          python changelog_generator.py generate --version ${{ needs.validate.outputs.version }}
      
      - name: Generate release notes
        run: |
          python changelog_generator.py release --version ${{ needs.validate.outputs.version }}
      
      - name: Create Git tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${{ needs.validate.outputs.version }}" || true
          git tag -a "v${{ needs.validate.outputs.version }}" -m "Release ${{ needs.validate.outputs.version }}"
      
      - name: Push changes
        if: ${{ !inputs.dry_run }}
        run: |
          git push origin HEAD
          git push origin "v${{ needs.validate.outputs.version }}"
      
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v1
        with:
          name: "Release ${{ needs.validate.outputs.version }}"
          body_path: releases/release-${{ needs.validate.outputs.version }}.md
          draft: ${{ inputs.draft }}
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload release assets
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v1
        with:
          files: |
            releases/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: [validate, release]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Notify on success
        if: needs.release.result == 'success'
        run: |
          echo "✅ Release ${{ needs.validate.outputs.version }} created successfully!"
      
      - name: Notify on failure
        if: needs.release.result == 'failure'
        run: |
          echo "❌ Release failed. Please check the logs."
          exit 1
