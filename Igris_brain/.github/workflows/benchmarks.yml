name: Performance Benchmarks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'  # Run weekly on Monday at 4 AM UTC
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-benchmark
      
      - name: Create workspace directory
        run: mkdir -p agent_workspace
      
      - name: Run benchmarks
        run: |
          python -m benchmarks.test_performance
      
      - name: Run pytest benchmarks
        run: |
          pytest benchmarks/ -v --benchmark-json=benchmark-results.json
      
      - name: Store benchmark results
        uses: actions/cache@v4
        with:
          path: |
            benchmarks/results/
            benchmark-results.json
          key: benchmark-${{ github.sha }}
          restore-keys: |
            benchmark-
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/results/
            benchmark-results.json
          retention-days: 30
      
      - name: Compare with baseline
        if: github.event_name == 'pull_request'
        run: |
          python -c "
          import json
          from pathlib import Path
          
          # Load current results
          current_file = Path('benchmark-results.json')
          if not current_file.exists():
              print('No current benchmark results')
              exit(0)
          
          with open(current_file) as f:
              current = json.load(f)
          
          # Load baseline from cache
          baseline_file = Path('baseline-results.json')
          if baseline_file.exists():
              with open(baseline_file) as f:
                  baseline = json.load(f)
              
              # Compare
              from benchmarks.performance import compare_benchmarks
              comparison = compare_benchmarks(baseline, current)
              
              print('=== Benchmark Comparison ===')
              print(f'Regressions: {comparison[\"summary\"][\"regressions\"]}')
              print(f'Improvements: {comparison[\"summary\"][\"improvements\"]}')
              print(f'Unchanged: {comparison[\"summary\"][\"unchanged\"]}')
              
              if comparison['regressions']:
                  print('\n⚠️ Regressions detected:')
                  for reg in comparison['regressions']:
                      print(f'  {reg[\"name\"]}: {reg[\"change_percent\"]}% slower')
          else:
              print('No baseline found, skipping comparison')
          "
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const benchmarkFile = 'benchmark-results.json';
            
            if (!fs.existsSync(benchmarkFile)) {
              return;
            }
            
            const benchmark = JSON.parse(fs.readFileSync(benchmarkFile, 'utf8'));
            const summary = benchmark.summary || {};
            
            let body = `## 📊 Performance Benchmark Results\n\n`;
            body += `| Metric | Value |\n|--------|-------|\n`;
            body += `| Total Benchmarks | ${summary.total_benchmarks || 0} |\n`;
            body += `| Average Time | ${summary.avg_time_ms || 0} ms |\n`;
            body += `| Fastest | ${summary.fastest || 'N/A'} |\n`;
            body += `| Slowest | ${summary.slowest || 'N/A'} |\n\n`;
            
            body += `### Top 5 Fastest\n\n`;
            body += `| Benchmark | Time (ms) |\n|-----------|----------|\n`;
            
            const benchmarks = benchmark.benchmarks || [];
            const sorted = benchmarks.sort((a, b) => a.avg_ms - b.avg_ms).slice(0, 5);
            
            for (const b of sorted) {
              body += `| ${b.name} | ${b.avg_ms.toFixed(2)} |\n`;
            }
            
            body += `\n<sub>Generated by performance benchmark workflow</sub>`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
      
      - name: Check for regressions
        if: github.event_name == 'pull_request'
        run: |
          python -c "
          import json
          from pathlib import Path
          
          current_file = Path('benchmark-results.json')
          baseline_file = Path('baseline-results.json')
          
          if not current_file.exists() or not baseline_file.exists():
              print('Skipping regression check')
              exit(0)
          
          with open(current_file) as f:
              current = json.load(f)
          with open(baseline_file) as f:
              baseline = json.load(f)
          
          from benchmarks.performance import compare_benchmarks
          comparison = compare_benchmarks(baseline, current, threshold=0.2)
          
          if comparison['regressions']:
              print('❌ Performance regressions detected!')
              for reg in comparison['regressions']:
                  print(f'  {reg[\"name\"]}: {reg[\"change_percent\"]}% slower')
              exit(1)
          else:
              print('✅ No significant regressions detected')
          "

  update-baseline:
    needs: benchmark
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
      
      - name: Update baseline
        run: |
          if [ -f "benchmark-results.json" ]; then
            cp benchmark-results.json baseline-results.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add baseline-results.json
            git commit -m "chore(benchmarks): update baseline [skip ci]" || true
            git push
          fi
