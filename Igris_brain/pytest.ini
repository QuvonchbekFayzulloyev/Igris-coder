[pytest]
# Faqat haqiqiy test fayllar (test_*.py) yig'iladi — debug/oddiy skriptlar
# import'da MCP/LLM'ni ishga tushirib, kolleksiyani bloklab qo'ymasligi uchun.
python_files = test_*.py

# Roadmap v2 C3 (§18): e2e qatlami — CI'da alohida job'da yugurtiriladi.
# Unit/regression: pytest -m "not e2e"   |   E2E layer: pytest -m e2e
markers =
    e2e: long-running end-to-end executor scenario testlari (Phase C1/C2)

# Ijro paytida vaqtinchalik/report papkalarini skanerlama
norecursedirs = reports agent_workspace e2e_shots .pytest_cache __pycache__
