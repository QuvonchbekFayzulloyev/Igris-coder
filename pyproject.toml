[project]
name = "igris-cli"
version = "0.1.0"
description = "Local Claude-Code-style agent CLI running against Ollama, with real MCP tools and a context-understanding reprompt loop."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
    "mcp>=1.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
igris = "igris.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["igris*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
